# Compila el juego y lo publica en GitHub Pages en cada push a main.
# En GitHub: Settings > Pages > Source = "GitHub Actions" (una sola vez).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # Pruebas en un navegador de verdad: una temporada del modo historia y un duelo del multijugador
      - run: npx playwright install --with-deps chromium
      # Cada prueba en su paso: si una falla, se ve cuál y el final de su salida queda como anotación
      - name: "Prueba: modo historia"
        run: bash tools/ci-e2e.sh historia npm run e2e
      - name: "Prueba: temporada de la moneda"
        run: bash tools/ci-e2e.sh moneda npm run e2e:moneda
      - name: "Prueba: multijugador"
        run: bash tools/ci-e2e.sh multijugador npm run e2e:mp
      - name: "Prueba: motor nuevo"
        run: bash tools/ci-e2e.sh motor-nuevo npm run e2e:next
      - name: "Prueba: pasarela con concepto"
        run: bash tools/ci-e2e.sh jurado npm run e2e:jurado
      - name: "Prueba: modo temporada"
        run: bash tools/ci-e2e.sh temporada npm run e2e:temporada
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
