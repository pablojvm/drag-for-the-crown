# Compila el juego y lo publica en GitHub Pages en cada push a main.
# En GitHub: Settings > Pages > Source = "GitHub Actions" (una sola vez).
#
# Para que publicar sea rápido (un par de minutos), solo bloquean la publicación las comprobaciones rápidas
# (tipos, lint, tests y compilar). Las pruebas en navegador van a la vez, cada una en su trabajo, y no la frenan:
# si alguna falla, el push sale en rojo en Actions con el nombre de la prueba, pero la web ya está publicada.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_MP_URL: ${{ vars.VITE_MP_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Pruebas en un navegador de verdad, todas a la vez (cada una en su máquina)
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: historia, run: npm run e2e }
          - { name: moneda, run: npm run e2e:moneda }
          - { name: multijugador, run: npm run e2e:mp }
          - { name: motor-nuevo, run: npm run e2e:next }
          - { name: historia-nueva, run: npm run e2e:historia-nueva }
          - { name: grupos, run: npm run e2e:grupos }
          - { name: jurado, run: npm run e2e:jurado }
          # El modo temporada del motor nuevo ya no se abre desde la portada: basta con una temporada
          - { name: temporada, run: node tools/e2e-temporada.mjs http://localhost:4173/ }
    name: "Prueba: ${{ matrix.name }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: bash tools/ci-e2e.sh ${{ matrix.name }} ${{ matrix.run }}
  # Servidor de salas (Colyseus): temporadas enteras con bots en todos los formatos y dos navegadores contra él
  servidor:
    runs-on: ubuntu-latest
    name: "Prueba: servidor de salas"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run build --prefix server
          PORT=2599 node server/dist/index.js &
          for i in $(seq 1 20); do curl -sf http://localhost:2599/salud >/dev/null && break; sleep 1; done
          for f in normal allstars winners repesca suerte corazon moneda; do FMT=$f bash tools/ci-e2e.sh servidor-$f node tools/e2e-mp-server.mjs; done
          bash tools/ci-e2e.sh servidor-navegador node tools/e2e-mp-online.mjs
