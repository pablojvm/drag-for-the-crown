# Despliega el servidor de salas en Fly.io cuando cambian sus reglas o su código.
# Hace falta el secreto FLY_API_TOKEN en el repo (fly tokens create deploy -a dftc-salas). Sin él, no hace nada.
name: Servidor de salas
on:
  push:
    branches: [main]
    paths: ["server/**", "src/mp/**", "src/core/**", "fly.toml", ".dockerignore"]
  workflow_dispatch:
concurrency:
  group: fly
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ¿Hay token de Fly.io?
        id: tok
        run: echo "ok=${{ secrets.FLY_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.tok.outputs.ok == 'true'
      - run: flyctl deploy --remote-only
        if: steps.tok.outputs.ok == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
