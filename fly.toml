# fly.toml app configuration file generated for drag-for-the-crown on 2026-11-02T18:35:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'drag-for-the-crown'
primary_region = 'ams'

[build]
  dockerfile = 'server/Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 500
    soft_limit = 400

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/salud'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
